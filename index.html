<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たしざん・のりものずかん - のりものカードを集めよう！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #fff;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }

        /* 3Dボタン風アニメーション */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        /* カードのホログラム・キラ演出（カード枠内に限定） */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 震えるアニメーション（間違い時） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 脈動アニメーション */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* 風で揺れる草むらのアニメーション */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(-4deg); }
        }
        .animate-grass-sway {
            transform-origin: bottom center;
            animation: grassSway 2.5s ease-in-out infinite;
        }

        /* ハート弾丸飛翔アニメーション */
        @keyframes flyMissile {
            0% { transform: translate(0, 0) scale(0.6) rotate(15deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translate(180px, -10px) scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: translate(210px, 0px) scale(1.2) rotate(0deg); opacity: 0; }
        }
        .animate-fly-missile {
            animation: flyMissile 0.45s ease-in forwards;
        }

        /* ドット絵キャラクターの小刻みなバトルアニメーション */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-pixel-bounce {
            animation: pixelBounce 0.4s steps(2) infinite;
        }

        @keyframes pixelMonster {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(1.02); }
        }
        .animate-pixel-monster {
            animation: pixelMonster 0.5s steps(2) infinite;
        }

        /* ドット絵のくっきり描画指定 */
        .pixelated {
            image-rendering: pixelated;
        }

        /* 超豪華レインボーネオンボーダー（全クリア・MUR時） */
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-100 overflow-hidden relative">

    <!-- お祝い用花火・紙吹雪 Canvas -->
    <canvas id="celebration-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

    <!-- ヘッダーナビゲーション -->
    <header class="bg-slate-900/90 border-b border-indigo-500/30 px-4 py-2.5 shadow-md shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showStageSelect()">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-500 to-yellow-400 flex items-center justify-center font-black text-lg shadow-md border-2 border-white text-slate-900">
                    ＋
                </div>
                <h1 class="font-black text-base sm:text-xl tracking-wider text-amber-300 drop-shadow">たしざん・のりものずかん</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="showAlbum()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-3.5 rounded-full border border-indigo-300/40 flex items-center gap-1.5 shadow-md btn-3d text-xs sm:text-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-yellow-300"></i>
                    <span>カードずかん (<span id="card-count">0/20</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col justify-between overflow-hidden">

        <!-- 1. レベル選択画面 -->
        <section id="stage-select-screen" class="flex flex-col justify-between h-full py-2 space-y-3">
            <div class="text-center space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-white drop-shadow">「レベル」をえらぼう！</h2>
                <p class="text-indigo-200 text-xs sm:text-sm">クリアするとのりものカードをGETできるよ！</p>
            </div>

            <!-- 通知用トーストメッセージ -->
            <div id="toast-message" class="hidden transition-all duration-300 transform -translate-y-2 opacity-0 bg-slate-900/95 border-2 border-amber-400 text-amber-200 text-xs sm:text-sm font-black px-4 py-2 rounded-full shadow-2xl text-center max-w-sm mx-auto">
                メッセージ
            </div>

            <div id="stages-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl mx-auto w-full my-auto">
                <!-- JavaScriptでレベルボタンが動的に挿入されます -->
            </div>

            <div id="stage-footer-tip" class="text-center text-slate-400 text-[11px]">
                💡 クリアすると次のレベルがオープン！高いレベルほどレアなカードがたくさんもらえるよ！
            </div>
        </section>

        <!-- 2. ゲーム画面 -->
        <section id="game-screen" class="hidden flex flex-col justify-between h-full max-w-md mx-auto w-full py-1">
            <!-- 進行度・ヘッダー情報 -->
            <div class="w-full bg-slate-900/80 p-2.5 rounded-2xl border border-indigo-500/30 flex justify-between items-center shadow-lg shrink-0">
                <div class="flex items-center gap-2">
                    <span id="current-stage-title" class="text-lg sm:text-xl font-black text-amber-300">レベル1</span>
                    <span id="current-round-tag" class="text-[11px] bg-indigo-500/40 text-indigo-200 px-2 py-0.5 rounded-full border border-indigo-400/30">こたえが 5いか</span>
                </div>
                <!-- ライフ表示 -->
                <div class="flex items-center space-x-1" id="hearts-container">
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                </div>
            </div>

            <!-- 残り問題数 10連四角ゲージ表示エリア -->
            <div id="master-gauge-container" class="w-full bg-slate-900/80 p-2 rounded-xl border border-purple-500/30 flex items-center justify-between gap-2 shadow-md shrink-0 my-1">
                <span class="text-[10px] font-black text-amber-300 shrink-0">のこり</span>
                <div id="master-gauge-boxes" class="flex flex-1 items-center justify-between gap-1">
                    <!-- JSで10個の四角ゲージを動的生成 -->
                </div>
            </div>

            <!-- ドット絵バトルエリア（青空と風に揺れる草むら背景） -->
            <div class="w-full border-2 border-emerald-400/60 rounded-2xl p-2 flex items-center justify-between shrink-0 my-1 relative overflow-hidden h-36 shadow-2xl bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-300">
                
                <!-- 雲アニメーション（背景遠景） -->
                <div class="absolute top-2 left-6 w-12 h-4 bg-white/70 rounded-full blur-[0.5px]"></div>
                <div class="absolute top-4 right-12 w-16 h-5 bg-white/60 rounded-full blur-[0.5px]"></div>

                <!-- 風で揺れる草むらレイヤー（下部） -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-emerald-500 border-t-2 border-emerald-400 flex items-end justify-around animate-grass-sway overflow-hidden pointer-events-none">
                    <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[18px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[20px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[26px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[9px] border-l-transparent border-r-[9px] border-r-transparent border-b-[19px] border-b-emerald-600"></div>
                </div>

                <!-- 左：車に挑む男の子 -->
                <div class="relative z-20 flex items-center justify-center pl-2">
                    <div class="w-16 h-16 animate-pixel-bounce flex items-center justify-center filter drop-shadow-md select-none">
                        <!-- 元気な男の子のSVG -->
                        <svg class="w-16 h-16 pixelated filter drop-shadow-lg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- リュックサック -->
                            <rect x="6" y="15" width="4" height="9" rx="1.5" fill="#dc2626" stroke="#0f172a" stroke-width="0.8"/>
                            <!-- 脚＆スニーカー -->
                            <rect x="11" y="23" width="3.5" height="5" fill="#1e3a8a"/>
                            <rect x="16.5" y="23" width="3.5" height="5" fill="#1e3a8a"/>
                            <rect x="10.5" y="27.5" width="5" height="2.5" rx="1" fill="#ef4444" stroke="#0f172a" stroke-width="0.7"/>
                            <rect x="16.5" y="27.5" width="5.5" height="2.5" rx="1" fill="#ef4444" stroke="#0f172a" stroke-width="0.7"/>
                            <!-- 胴体（青いTシャツ） -->
                            <rect x="10" y="14" width="11" height="10" rx="1.5" fill="#2563eb" stroke="#0f172a" stroke-width="0.8"/>
                            <polygon points="15.5,16 16.3,18 18.3,18 16.7,19.2 17.3,21 15.5,19.9 13.7,21 14.3,19.2 12.7,18 14.7,18" fill="#facc15"/>
                            <!-- 前に突き出した腕 -->
                            <rect x="19" y="15.5" width="7" height="3.2" rx="1.5" fill="#fed7aa" stroke="#0f172a" stroke-width="0.7"/>
                            <rect x="18" y="15" width="3" height="4" rx="1" fill="#2563eb"/>
                            <!-- 頭＆顔 -->
                            <circle cx="15.5" cy="9.5" r="5.5" fill="#fed7aa" stroke="#0f172a" stroke-width="0.8"/>
                            <!-- 茶色い髪の毛 -->
                            <path d="M10 9 C10 5.5 21 5.5 21 9 L19 10 L16 8.5 L12 10 Z" fill="#78350f"/>
                            <!-- 目と笑顔 -->
                            <circle cx="17.8" cy="9.8" r="0.9" fill="#0f172a"/>
                            <path d="M16.5 12 Q18 13.2 19.3 12" stroke="#dc2626" stroke-width="0.9" stroke-linecap="round" fill="none"/>
                            <!-- 赤いキャップ帽子 -->
                            <path d="M9.5 7.5 C9.5 3.5 21.5 3.5 21.5 7.5 Z" fill="#ef4444" stroke="#0f172a" stroke-width="0.8"/>
                            <rect x="15" y="6.2" width="9.5" height="1.8" rx="0.8" fill="#dc2626" stroke="#0f172a" stroke-width="0.7"/>
                        </svg>
                    </div>

                    <!-- 飛んでいくハート -->
                    <div id="missile-anim" class="hidden absolute left-12 top-4 z-30 pointer-events-none">
                        <svg class="w-8 h-8 pixelated drop-shadow-lg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 14.5 C8 14.5 1.5 10.2 1.5 5.5 C1.5 3.3 3.2 1.8 5.2 1.8 C6.5 1.8 7.5 2.5 8 3.5 C8.5 2.5 9.5 1.8 10.8 1.8 C12.8 1.8 14.5 3.3 14.5 5.5 C14.5 10.2 8 14.5 8 14.5 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
                            <ellipse cx="4.8" cy="4.8" rx="1.4" ry="0.9" transform="rotate(-25 4.8 4.8)" fill="#fecdd3"/>
                        </svg>
                    </div>
                </div>

                <!-- 右：ターゲットの車 -->
                <div id="wild-pokemon-container" class="relative z-10 flex flex-col items-center justify-center w-36 h-32 pr-2 overflow-visible">
                    <div id="target-pokemon-scale-box" class="transition-all duration-500 origin-center flex flex-col items-center scale-[2.2]">
                        <div class="animate-pixel-monster flex flex-col items-center">
                            <div id="pixel-monster-svg-box" class="w-16 h-16 filter drop-shadow-xl flex items-center justify-center">
                                <!-- JSで生成される車アイコン -->
                            </div>
                        </div>
                    </div>

                    <div id="hit-explosion" class="hidden absolute z-30 pointer-events-none">
                        <div class="text-3xl animate-ping">💥</div>
                    </div>

                    <div id="capture-stars" class="hidden absolute z-40 pointer-events-none text-2xl font-black text-amber-300 animate-bounce drop-shadow">
                        ✨ GET! ✨
                    </div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="w-full shrink-0 my-2">
                <div class="w-full h-32 sm:h-36 rounded-2xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-white shadow-xl flex flex-col items-center justify-center p-2 text-slate-900 animate-pulse-subtle">
                    <div id="question-text" class="text-4xl sm:text-5xl font-black tracking-wider text-slate-900 my-1">
                        1 ＋ 1
                    </div>
                    <div id="yomi-text" class="text-xs sm:text-sm font-bold text-amber-900 bg-amber-100/90 px-3 py-0.5 rounded-full border border-amber-300">
                        いち たす いち は
                    </div>
                </div>
            </div>

            <!-- 選択肢 4択 -->
            <div class="w-full shrink-0 my-2">
                <div id="options-grid" class="flex justify-center items-center gap-2 sm:gap-4 w-full">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <div class="text-center text-indigo-300/70 text-[11px] shrink-0">
                せいかいの 丸いカードを選んでね！
            </div>
        </section>

        <!-- 3. クリア演出画面 -->
        <section id="clear-screen" class="hidden flex flex-col justify-center items-center h-full max-w-2xl mx-auto w-full py-2 relative z-40">
            <div id="clear-modal-box" class="bg-slate-900/95 border-2 border-amber-400/60 rounded-3xl p-4 sm:p-5 shadow-2xl w-full text-center space-y-3 relative overflow-y-auto max-h-full">
                <div class="space-y-1">
                    <div id="clear-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow">
                        GOLD CLEAR!
                    </div>
                    <h2 id="clear-title" class="text-2xl font-black text-amber-300 drop-shadow">レベル1 クリア！</h2>
                    <p id="clear-subtitle" class="text-indigo-200 text-xs sm:text-sm">のりものカードを ゲットしたよ！</p>
                    
                    <div id="world-clear-banner" class="hidden my-2 py-2 px-3 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 text-white font-black text-sm rounded-xl shadow-lg border-2 border-white animate-bounce">
                        🎉 コンプリート達成！ 🎉
                    </div>
                </div>

                <!-- 獲得カードプレビュー（1〜5枚対応） -->
                <div class="flex justify-center py-1 overflow-x-auto">
                    <div id="reward-card-container" class="flex flex-wrap justify-center items-center gap-2.5">
                        <!-- カードDOM -->
                    </div>
                </div>

                <div class="space-y-2 pt-1 max-w-md mx-auto">
                    <button id="next-btn" onclick="handleNextStep()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-lg font-black rounded-xl shadow-lg btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <span>つぎへ すすむ</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="startStage(currentStageNumber)" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black text-base rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう１かいする</span>
                    </button>
                    <button onclick="showStageSelect()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>メニューに戻る</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. アルバム（カード図鑑）画面 -->
        <section id="album-screen" class="hidden flex flex-col h-full space-y-2 overflow-hidden">
            <div class="flex justify-between items-center border-b border-indigo-500/30 pb-2 shrink-0">
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-amber-300 flex items-center gap-1.5">
                        <i data-lucide="award" class="w-6 h-6 text-yellow-400"></i> のりものカードずかん
                    </h2>
                    <p class="text-indigo-200 text-xs">ゲットしたカードをタップして大きくみられるよ！</p>
                </div>
                <button onclick="showStageSelect()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs btn-3d">
                    もどる
                </button>
            </div>

            <!-- カードグリッド -->
            <div id="album-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1">
                <!-- 動的に生成 -->
            </div>
        </section>

        <!-- 5. カード拡大モーダル -->
        <div id="card-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4" onclick="closeCardModal()">
            <div class="relative transform scale-125 sm:scale-150 transition-transform duration-300" onclick="event.stopPropagation()">
                <div id="modal-card-container"></div>
            </div>
            <button onclick="closeCardModal()" class="mt-12 bg-white/20 hover:bg-white/30 text-white font-black px-6 py-2 rounded-full border border-white/40 text-sm shadow-xl backdrop-blur-md">
                とじる
            </button>
        </div>

        <!-- ゲームオーバーモーダル -->
        <div id="gameover-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border-2 border-red-500/60 rounded-3xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
                <div class="w-14 h-14 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto border border-red-500/40">
                    <i data-lucide="heart-off" class="w-8 h-8"></i>
                </div>
                <div class="space-y-1">
                    <h3 class="text-xl font-black text-white">ざんねん！ライフがなくなったよ</h3>
                    <p class="text-slate-300 text-xs">もういちど 挑戦して クリアを目指そう！</p>
                </div>
                <button onclick="retryCurrentStage()" class="w-full py-3 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-400 hover:to-rose-500 text-white font-black text-base rounded-xl shadow-lg btn-3d">
                    もう一回する
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript ロジック -->
    <script>
        // --- 1. 定数とデータ定義 ---

        const SAVE_KEY = 'tasupoke_jr_save_v1';

        const LEVELS_INFO = [
            { level: 1, title: 'レベル1', desc: 'こたえが 5いか', rewardCount: 1, maxPool: 20 },
            { level: 2, title: 'レベル2', desc: 'こたえが 10いか', rewardCount: 2, maxPool: 30 },

        // --- サウンド＆音声読み上げ（Web Audio API & SpeechSynthesis） ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        document.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });

        function playPinpon() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        function playBuzzer() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playFanfare(isAllClear = false) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const notes = isAllClear 
                ? [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51]
                : [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.12;
                const duration = idx === notes.length - 1 ? 0.8 : 0.15;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function playCompleteFanfare() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.1;
                const duration = idx === notes.length - 1 ? 1.5 : 0.2;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function startBGM() {
            stopBGM();
            const ctx = getAudioContext();
            if (!ctx) return;

            // 明るく楽しいCメジャーの軽快なメロディ＆ベース
            const bassNotes = [
                130.81, 196.00, 130.81, 196.00,
                174.61, 261.63, 130.81, 196.00,
                146.83, 196.00, 130.81, 196.00,
                196.00, 246.94, 261.63, 196.00
            ];
            const leadNotes = [
                523.25, 659.25, 783.99, 659.25,
                698.46, 880.00, 783.99, 659.25,
                587.33, 698.46, 659.25, 523.25,
                587.33, 783.99, 523.25, 0
            ];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;

                const bassFreq = bassNotes[noteIdx % bassNotes.length];
                if (bassFreq > 0) {
                    const bassOsc = audioCtx.createOscillator();
                    const bassGain = audioCtx.createGain();
                    bassOsc.type = 'triangle';
                    bassOsc.frequency.setValueAtTime(bassFreq, now);
                    bassGain.gain.setValueAtTime(0.09, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    bassOsc.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bassOsc.start(now);
                    bassOsc.stop(now + 0.14);
                }

                const leadFreq = leadNotes[noteIdx % leadNotes.length];
                if (leadFreq > 0) {
                    const leadOsc = audioCtx.createOscillator();
                    const leadGain = audioCtx.createGain();
                    leadOsc.type = 'triangle';
                    leadOsc.frequency.setValueAtTime(leadFreq, now);
                    leadGain.gain.setValueAtTime(0.07, now);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    leadOsc.connect(leadGain);
                    leadGain.connect(audioCtx.destination);
                    leadOsc.start(now);
                    leadOsc.stop(now + 0.15);
                }

                noteIdx++;
            }, 165);
        }

        // 出題順をランダムにし、同じ問題が連続しないように並び替える
        function shuffleQuestions(list) {
            const arr = [...list];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            for (let i = 1; i < arr.length; i++) {
                if (arr[i].num1 === arr[i - 1].num1 && arr[i].num2 === arr[i - 1].num2) {
                    for (let j = i + 1; j < arr.length; j++) {
                        if (arr[j].num1 !== arr[i - 1].num1 || arr[j].num2 !== arr[i - 1].num2) {
                            [arr[i], arr[j]] = [arr[j], arr[i]];
                            break;
                        }
                    }
                }
            }
            return arr;
        }

        // レベル別問題生成プール取得
        function getPoolForLevel(level) {
            const pool = [];
            if (level === 1) {
                // 答えが5以下で0を含まない足し算
                for (let a = 1; a <= 4; a++) {
                    for (let b = 1; b <= 4; b++) {
                        if (a + b <= 5) {
                            pool.push({ num1: a, num2: b, answer: a + b });
                        }
                    }
                }
            } else if (level === 2) {
                // 答えが必ず6以上10以下の足し算（各項に0が入る問題は出さない）
                for (let a = 1; a <= 9; a++) {
                    for (let b = 1; b <= 9; b++) {
                        if (a + b >= 6 && a + b <= 10) {
                            pool.push({ num1: a, num2: b, answer: a + b });
                        }
                    }
                }
            } else if (level === 3) {
                // 「10いくつ＋1桁＝10いくつ」または「1桁＋10いくつ＝10いくつ」（答え11以上、0なし）
                for (let a = 11; a <= 18; a++) {
                    for (let b = 1; b <= 8; b++) {
                        if (a + b <= 19) {
                            pool.push({ num1: a, num2: b, answer: a + b });
                        }
                    }
                }
                for (let a = 1; a <= 8; a++) {
                    for (let b = 11; b <= 18; b++) {
                        if (a + b <= 19) {
                            pool.push({ num1: a, num2: b, answer: a + b });
                        }
                    }
                }
            } else if (level === 4) {
                // 繰り上がる足し算（答えが10になる問題は出さない＝11以上、0なし）
                for (let a = 1; a <= 9; a++) {
                    for (let b = 1; b <= 9; b++) {
                        if (a + b >= 11) {
                            pool.push({ num1: a, num2: b, answer: a + b });
                        }
                    }
                }
            }
            return pool;
        }

        function generateQuestions(level) {
            if (level === 1) {
                // 答えが0になる問題が1問
                const qZeroAns = { num1: 0, num2: 0, answer: 0 };

                // 足す数または足される数が0の問題が1問（答えが0を除く）
                const oneZeroPool = [];
                for (let n = 1; n <= 5; n++) {
                    oneZeroPool.push({ num1: 0, num2: n, answer: n });
                    oneZeroPool.push({ num1: n, num2: 0, answer: n });
                }
                const qOneZero = oneZeroPool[Math.floor(Math.random() * oneZeroPool.length)];

                // 残りの8問（答えが5以下で0を含まない足し算）
                const restPool = shuffleQuestions(getPoolForLevel(1)).slice(0, 8);

                return shuffleQuestions([qZeroAns, qOneZero, ...restPool]);
            }

            if (level === 2) {
                // 答えが必ず6以上の数（10問）
                const pool = shuffleQuestions(getPoolForLevel(2));
                return shuffleQuestions(pool.slice(0, 10));
            }

            if (level === 3) {
                // 答えが11以上の数（10問・答えが10になる問題は出さない）
                const pool = shuffleQuestions(getPoolForLevel(3));
                return shuffleQuestions(pool.slice(0, 10));
            }

            if (level === 4) {
                // 答えが10になる問題は出さない（10問）
                const pool = shuffleQuestions(getPoolForLevel(4));
                return shuffleQuestions(pool.slice(0, 10));
            }

            if (level === 5) {
                // レベル2から1問、レベル3から2問、レベル4から7問出題
                const q2 = shuffleQuestions(getPoolForLevel(2)).slice(0, 1);

                // レベル3の出題ルールから生成した問題のうち、レベル2と被らないものから2問選出
                const l3Candidates = generateQuestions(3).filter(
                    item => !q2.some(existing => existing.num1 === item.num1 && existing.num2 === item.num2)
                );
                const q3 = shuffleQuestions(l3Candidates).slice(0, 2);

                const q4 = shuffleQuestions(getPoolForLevel(4)).slice(0, 7);

                return shuffleQuestions([...q2, ...q3, ...q4]);
            }

            const pool = getPoolForLevel(level);
            return shuffleQuestions(pool).slice(0, 10);
        }

        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');

                    heart.className = "w-6 h-6 text-red-500 fill-red-500";

        function showQuestion() {
            isProcessingAnswer = false;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            document.getElementById('question-text').innerText = `${q.num1} ＋ ${q.num2}`;

            const yomi1 = NUM_YOMI[q.num1] || `${q.num1}`;
            const yomi2 = NUM_YOMI[q.num2] || `${q.num2}`;
            document.getElementById('yomi-text').innerText = `${yomi1} たす ${yomi2} は`;

            speakAddQuestion(q.num1, q.num2);

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const shuffled = generateSmartOptions(q);

            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-indigo-600 via-blue-500 to-cyan-400 border-4 border-white text-white text-xl sm:text-2xl font-black shadow-xl btn-3d flex items-center justify-center hover:scale-105 transition-transform";
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(ans, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function generateSmartOptions(q) {
            const num1 = q.num1;
            const num2 = q.num2;
            const answer = q.answer;

            const candidates = new Set();

            // 近い数値の誤答候補
            [answer - 1, answer + 1, answer - 2, answer + 2, answer + 3, answer - 3].forEach(val => {
                if (val >= 0 && val <= 20 && val !== answer) {
                    candidates.add(val);
                }
            });

            // 引き算や桁間違いなどの誤答候補
            [Math.abs(num1 - num2), answer + 10, answer - 10].forEach(val => {
                if (val >= 0 && val <= 20 && val !== answer) {
                    candidates.add(val);
                }
            });

            // 0〜20の数値から補充
            for (let v = 0; v <= 20; v++) {
                if (v !== answer) candidates.add(v);
            }

            const sortedCandidates = Array.from(candidates).sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            const topPool = sortedCandidates.slice(0, Math.min(6, sortedCandidates.length));
            topPool.sort(() => Math.random() - 0.5);

            const wrongOptions = topPool.slice(0, 3);
            const result = [answer, ...wrongOptions];

            return result.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selectedAns, btn) {
            if (isProcessingAnswer) return;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            if (selectedAns === q.answer) {
                isProcessingAnswer = true;
                playPinpon();
                speakAddAnswer(q.answer);

                btn.classList.remove('from-indigo-600', 'via-blue-500', 'to-cyan-400');
                btn.classList.add('from-emerald-400', 'to-teal-500', 'scale-110');

                const isFinalQuestion = (gameState.currentQuestionIndex + 1 >= gameState.questions.length);

                if (!isFinalQuestion) {
                    // 途中問題：ハート攻撃
                    const missile = document.getElementById('missile-anim');
                    if (missile) {
                        missile.classList.remove('hidden');
                        missile.classList.add('animate-fly-missile');
                        setTimeout(() => {
                            missile.classList.add('hidden');
                            missile.classList.remove('animate-fly-missile');
                            
                            const hit = document.getElementById('hit-explosion');
                            if (hit) {
                                hit.classList.remove('hidden');
                                setTimeout(() => hit.classList.add('hidden'), 350);
                            }
                        }, 400);
                    }

                    setTimeout(() => {
                        gameState.currentQuestionIndex++;
                        updateMasterGaugeUI();
                        renderMonsterSvg();
                        showQuestion();
                    }, 1200);
                } else {
                    // 最終問題：車のクリア演出アニメーション
                    gameState.currentQuestionIndex++;
                    updateMasterGaugeUI();

                    const targetBox = document.getElementById('target-pokemon-scale-box');
                    const stars = document.getElementById('capture-stars');
                    const hit = document.getElementById('hit-explosion');

                    setTimeout(() => {
                        if (hit) {

                        }

                        setTimeout(() => {
                            if (targetBox) {

                            }
                        }, 300);

                        setTimeout(() => {
                            if (hit) hit.classList.add('hidden');

                        }, 1600);

                    }, 300);
                }

            } else {
                playBuzzer();
                btn.classList.add('animate-shake', 'from-rose-600', 'to-red-700');
                setTimeout(() => btn.classList.remove('animate-shake'), 400);

                gameState.lives--;
                updateHeartsUI();

                if (gameState.lives <= 0) {
                    stopBGM();
                    document.getElementById('gameover-modal').classList.remove('hidden');
                }
            }
        }

        function handleStageClear() {
            stopBGM();

            const level = gameState.currentLevel;
            const info = LEVELS_INFO.find(l => l.level === level) || LEVELS_INFO[0];

            let rank = 'bronze';
            if (gameState.lives === 3) rank = 'gold';
            else if (gameState.lives === 2) rank = 'silver';

            const currentRank = gameState.clearedRanks[level];
            const rankWeight = { gold: 3, silver: 2, bronze: 1 };
            if (!currentRank || rankWeight[rank] > (rankWeight[currentRank] || 0)) {
                gameState.clearedRanks[level] = rank;
            }

            // 次のレベル開放
            if (level < 5) {
                const nextLevel = level + 1;
                if (!gameState.unlockedLevels.includes(nextLevel)) {
                    gameState.unlockedLevels.push(nextLevel);
                }
            }

            const prevOwnedCount = gameState.ownedCards.length;
            const prev20Done = isFirst20Complete();
            const prev40Done = isFirst40Complete();

            // レベルに応じた枚数（1〜5枚）のカードを重複なしで選出
            const rewardedCards = [];
            for (let i = 0; i < info.rewardCount; i++) {
                const alreadyDrawnIds = rewardedCards.map(c => c.id);
                const card = drawCardForLevel(level, alreadyDrawnIds);
                if (card) {
                    rewardedCards.push(card);
                    if (!gameState.ownedCards.includes(card.id)) {
                        gameState.ownedCards.push(card.id);
                        if (!gameState.newCards.includes(card.id)) {
                            gameState.newCards.push(card.id);
                        }
                    }
                }
            }

            saveData();

            const currentOwnedCount = gameState.ownedCards.length;
            const current20Done = isFirst20Complete();
            const current40Done = isFirst40Complete();

            const clearBadge = document.getElementById('clear-badge');
            if (rank === 'gold') {
                clearBadge.innerText = '🥇 PERFECT GOLD!';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow gold-glow';
            } else if (rank === 'silver') {
                clearBadge.innerText = '🥈 SILVER CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-slate-300 text-slate-900 shadow';
            } else {
                clearBadge.innerText = '🥉 BRONZE CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-700 text-white shadow';
            }

            document.getElementById('clear-title').innerText = `${info.title} クリア！`;
            document.getElementById('clear-subtitle').innerText = `のりものカードを ${info.rewardCount}まい ゲットしたよ！`;

            const banner = document.getElementById('world-clear-banner');
            const reached20 = !prev20Done && current20Done;
            const reached40 = !prev40Done && current40Done;
            const reached60 = (prevOwnedCount < 60) && (currentOwnedCount === 60);
            const isAlwaysCelebrate = (currentOwnedCount === 60);

            if (reached60) {
                banner.innerText = '👑 カード図鑑 60種コンプリート達成！！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(true, true);
                playCompleteFanfare();
            } else if (reached40) {
                banner.innerText = '✨ 40種コンプリート！全60種が開放されたよ！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (reached20) {
                banner.innerText = '✨ 20種コンプリート！40種まで開放されたよ！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (isAlwaysCelebrate) {
                banner.innerText = '👑 図鑑コンプリート中！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(false, false);
                playFanfare(false);
            } else {
                banner.classList.add('hidden');
            }

            const cardBox = document.getElementById('reward-card-container');
            if (cardBox) {
                cardBox.innerHTML = rewardedCards.map(c => `
                    <div class="transform hover:scale-105 transition-transform duration-300 cursor-pointer" onclick='showCardModalById("${c.id}")'>
                        ${createCardHtml(c, false, rewardedCards.length >= 3)}
                    </div>
                `).join('');
            }

            hideAllScreens();
            document.getElementById('clear-screen').classList.remove('hidden');
        }

        // レベルと図鑑開放状況に応じた1枚抽選ロジック（重複せず必ずNEWカードを引く）
        function drawCardForLevel(level, alreadyDrawnIds = []) {
            const info = LEVELS_INFO.find(l => l.level === level) || LEVELS_INFO[0];
            const globalLimit = getGlobalCardLimit(); // 20 -> 40 -> 60
            const effectiveLimit = Math.min(globalLimit, info.maxPool);

            // 現在のレベル範囲内の未所持・未排出カードを抽出
            const poolInLevel = POKEMON_CARDS.slice(0, effectiveLimit);
            const unownedInLevel = poolInLevel.filter(
                c => !gameState.ownedCards.includes(c.id) && !alreadyDrawnIds.includes(c.id)
            );
            if (unownedInLevel.length > 0) {
                return pickWeightedCard(unownedInLevel, level);
            }

            // レベル範囲内がすべて所持済みの場合は、現在の図鑑上限（20/40/60）内の未所持カードを抽出
            const poolInGlobal = POKEMON_CARDS.slice(0, globalLimit);
            const unownedInGlobal = poolInGlobal.filter(
                c => !gameState.ownedCards.includes(c.id) && !alreadyDrawnIds.includes(c.id)
            );
            if (unownedInGlobal.length > 0) {
                return pickWeightedCard(unownedInGlobal, level);
            }

            // 全60種の中で未所持カードが残っている場合
            const unownedAll = POKEMON_CARDS.filter(
                c => !gameState.ownedCards.includes(c.id) && !alreadyDrawnIds.includes(c.id)
            );
            if (unownedAll.length > 0) {
                return pickWeightedCard(unownedAll, level);
            }

            // 全60種コンプリート済みの場合はランダム抽選
            return pickWeightedCard(poolInLevel, level);
        }

        function createCardHtml(card, isModal = false, isCompact = false) {
            const isNew = gameState.newCards.includes(card.id);
            let scaleClass = 'w-48 h-72';
            if (isModal) scaleClass = 'w-56 h-80';
            else if (isCompact) scaleClass = 'w-36 h-56 sm:w-40 sm:h-60';

            // C, U, R, RR はホログラムなし。AR, SR, SAR, UR, MUR のみホログラム対象
            const isFoilRarity = ['AR', 'SR', 'SAR', 'UR', 'MUR'].includes(card.rarity);
            let extraEffectClass = isFoilRarity ? 'card-foil' : '';
            let borderStyle = 'border-amber-500/80';

            if (card.rarity === 'MUR') {
                extraEffectClass = 'card-foil animate-rainbow-glow';
                borderStyle = 'border-yellow-200';
            } else if (card.rarity === 'UR') {
                extraEffectClass = 'card-foil';

            } else if (card.rarity === 'SAR' || card.rarity === 'SR') {
                extraEffectClass = 'card-foil';
                borderStyle = 'border-pink-300 super-glow';
            }

            // モーダル表示時はカード名称を省略（truncate）せずに全文表示
            const nameClass = isModal 
                ? 'text-sm sm:text-base tracking-wide text-amber-200 drop-shadow-md leading-tight break-words font-black text-center w-full' 
                : (isCompact
                    ? 'text-[11px] sm:text-xs tracking-wide truncate w-full text-center drop-shadow-md text-amber-200 font-black'
                    : 'text-xs sm:text-sm tracking-wide truncate w-full text-center drop-shadow-md text-amber-200 font-black');

            const illusBgClass = 'bg-stone-950/70 border-white/20 shadow-inner';
            const illusHeightClass = isCompact ? 'h-20 sm:h-24' : 'h-28 sm:h-32';
            const descTextClass = isModal

        // --- アルバム（カードずかん）機能 ---

        function showAlbum() {
            stopBGM();
            hideAllScreens();
            document.getElementById('album-screen').classList.remove('hidden');
            renderAlbumGrid();
        }

        function renderAlbumGrid() {
            const grid = document.getElementById('album-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const limit = getGlobalCardLimit();
            const availableCards = POKEMON_CARDS.slice(0, limit);

            availableCards.forEach(card => {
                const isOwned = gameState.ownedCards.includes(card.id);
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform duration-200";

                if (isOwned) {
                    wrapper.innerHTML = createCardHtml(card);
                    wrapper.onclick = () => showCardModal(card);
                } else {
                    wrapper.innerHTML = `
                        <div class="w-full h-44 sm:h-52 rounded-2xl bg-slate-900/80 border-2 border-slate-700 flex flex-col items-center justify-center text-slate-600 p-2 text-center shadow-inner relative overflow-hidden">
                            <i data-lucide="lock" class="w-8 h-8 mb-2 text-slate-600"></i>
                            <span class="text-xs font-bold text-slate-500">???</span>
                        </div>
                    `;
                }
                grid.appendChild(wrapper);
            });

            if (window.lucide) lucide.createIcons();
        }

        function showCardModalById(cardId) {
            const card = POKEMON_CARDS.find(c => c.id === cardId);
            if (card) showCardModal(card);
        }

        function showCardModal(card) {
            const container = document.getElementById('modal-card-container');
            if (!container) return;
            container.innerHTML = createCardHtml(card, true);

            // 既読処理
            const newIndex = gameState.newCards.indexOf(card.id);
            if (newIndex !== -1) {
                gameState.newCards.splice(newIndex, 1);
                saveData();
                if (!document.getElementById('album-screen').classList.contains('hidden')) {
                    renderAlbumGrid();
                }
            }

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        // --- お祝い演出（紙吹雪 & 連発花火） ---
        let celebrationAnimId = null;

        function launchCelebration(isComplete = false, isAllClear = false) {
            const canvas = document.getElementById('celebration-canvas');
            if (!canvas) return;
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const fireworks = [];

            const particleCount = isComplete ? 200 : (isAllClear ? 150 : 80);
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f97316'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 2 - 1,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    vRot: Math.random() * 10 - 5
                });
            }

            function createFirework() {
                const fx = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
                const fy = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1;
                const count = Math.floor(Math.random() * 30) + 40;
                const fwColor = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                    const speed = Math.random() * 5 + 3;
                    fireworks.push({
                        x: fx,
                        y: fy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3 + 2,
                        color: fwColor,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
            }

            let fwTimer = 0;
            const fwFrequency = isComplete ? 12 : 25;

            if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                fwTimer++;
                if (fwTimer % fwFrequency === 0) {
                    createFirework();
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    fw.x += fw.vx;
                    fw.y += fw.vy;
                    fw.vy += 0.05;
                    fw.alpha -= fw.decay;

                    if (fw.alpha <= 0) {
                        fireworks.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = fw.alpha;
                    ctx.fillStyle = fw.color;
                    ctx.beginPath();
                    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vRot;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                celebrationAnimId = requestAnimationFrame(loop);
            }

            loop();

            setTimeout(() => {
                if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.classList.add('hidden');
            }, isComplete ? 8000 : 5000);
        }
